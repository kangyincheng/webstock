services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    networks: [web]

  webstock:
    build:
      context: .
      dockerfile: Dockerfile
    image: webstock:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - PORT=8000
      - WORKERS=${WORKERS:-2}
      - REDIS_URL=redis://redis:6379/0
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/models:/app/backend/models
      - ./tushare_token.txt:/app/tushare_token.txt:ro
    networks: [web]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/system/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      webstock:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 挂载我们优化好的完整 nginx.conf（含 events/http/server 全部段）替换默认主配置
      - ./deploy/nginx/webstock.conf:/etc/nginx/nginx.conf:ro
      # 可选：挂载证书目录（需将 证书放到 ./deploy/nginx/certs/ 下）
      # - ./deploy/nginx/certs:/etc/nginx/certs:ro
      # 直接使用构建好的静态资源（比走后端 fallback 更快）
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/logs:/var/log/nginx
    networks: [web]

volumes:
  redis-data:

networks:
  web:
    driver: bridge
    # 阿里云 ECS 不需要自定义 MTU，默认即可
