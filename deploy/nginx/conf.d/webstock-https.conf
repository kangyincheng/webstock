# webstock Nginx 443 启用片段（证书到位后由部署脚本/手动写入 conf.d/webstock-https.conf）

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jeoj.com jeoj.com 8.130.158.196;

    # —— SSL 证书路径：certbot 默认目录 ——
    ssl_certificate     /etc/letsencrypt/live/www.jeoj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jeoj.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/www.jeoj.com/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver [::1]:53 223.5.5.5 114.114.114.114 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;
    index index.html;

    # 根域名 → 301 www（规范化 canonical 域名）
    if ($host = "jeoj.com") {
        return 301 https://www.jeoj.com$request_uri;
    }
    if ($host = "8.130.158.196") {
        return 301 https://www.jeoj.com$request_uri;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }
    location ~ ^/(favicon\.ico|robots\.txt|manifest\.webmanifest)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location /ws/ {
        proxy_pass http://webstock_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade        $http_upgrade;
        proxy_set_header Connection     "upgrade";
        proxy_set_header Host           $host;
        proxy_set_header X-Real-IP      $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://webstock_api;
        proxy_http_version 1.1;
        proxy_set_header Connection       "";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout  10s;
        proxy_send_timeout     600s;
        proxy_read_timeout     600s;
        gzip on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
