# ========== webstock Nginx 配置（客户端访问速度优化版）==========
# 目标：首屏 < 500ms（内网），静态资源命中率拉满。
# 优化点：
#   1. 长连接 keepalive 65s（浏览器同域复用）
#   2. 静态资源强缓存 1y + 内容哈希文件名（Vite 自动 hash）
#   3. gzip + brotli 双重压缩（Nginx 先 brotli，降级 gzip）
#   4. API 上游 keepalive（减少 TCP 握手，配合 uvicorn 长连接）
#   5. WebSocket /ws/* 正确升级（Upgrade / Connection）
#   6. 带宽限制与并发控制
#   7. open_file_cache 静态文件句柄缓存
#   8. sendfile + tcp_nopush / tcp_nodelay

# 如果启用 HTTPS，在下方把 443 server 段注释取消，并把 cert 挂到 /etc/nginx/certs。

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset utf-8;

    # --- 性能基础 ---
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    aio            threads;

    # 日志最小化（写入磁盘影响 QPS）
    access_log /var/log/nginx/access.log buffer=16k flush=30s;
    error_log  /var/log/nginx/error.log warn;

    # 超时（长连接）
    keepalive_timeout       65s;
    keepalive_requests      1000;
    reset_timedout_connection on;
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;

    # 客户端请求大小限制
    client_max_body_size 8m;
    client_body_buffer_size 128k;

    # --- 压缩（gzip+brotli）---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/manifest+json
        font/woff font/woff2 image/svg+xml;

    # brotli（如果有 ngx_brotli 模块；无则回退 gzip）
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        font/woff font/woff2 image/svg+xml;

    # --- 静态文件缓存 ---
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    include /etc/nginx/conf.d/*.conf;

    # --- 上游 FastAPI 连接池（keepalive 50 条）---
    upstream webstock_api {
        server webstock:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ================== HTTP 80 ==================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name 8.130.158.196 _;

        # 把无 Host/错 Host 直接重定向到我们的 IP（避免抓到奇怪流量）
        if ($host != "8.130.158.196") {
            set $need_redirect 1;
        }
        if ($host = "") {
            set $need_redirect 1;
        }
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$) {
            set $need_redirect 0;
        }

        root /usr/share/nginx/html;
        index index.html;

        # ---------- 静态资源：强缓存 + 内容哈希 Vite 文件名 ----------
        # /assets/* Vite build 出来都是 hash 命名，永远 1 年
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
            try_files $uri =404;
        }

        # favicon / robots / manifest
        location ~ ^/(favicon\.ico|robots\.txt|manifest\.webmanifest)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        # ---------- WebSocket（训练进度推送） ----------
        location /ws/ {
            proxy_pass http://webstock_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade        $http_upgrade;
            proxy_set_header Connection     "upgrade";
            proxy_set_header Host           $host;
            proxy_set_header X-Real-IP      $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # ---------- API ----------
        location /api/ {
            proxy_pass http://webstock_api;
            proxy_http_version 1.1;
            proxy_set_header Connection       "";
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_send_timeout     600s;     # 训练接口长
            proxy_read_timeout     600s;
            # 压缩响应（如果上游没压）
            gzip on;
            # 简单限频：每 IP 10 req/s 突发 20（ST 扫描/训练接口可能略高，可调）
            # limit_req zone=api burst=30 nodelay;
        }

        # ---------- SPA fallback：除 /api /ws /assets 外交给 index.html ----------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ================== HTTPS 443（证书已挂载时启用）==================
    # server {
    #     listen 443 ssl http2 default_server;
    #     listen [::]:443 ssl http2 default_server;
    #     server_name your.domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_timeout 1d;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     root /usr/share/nginx/html; index index.html;
    #
    #     # （与 80 段里的 /assets /ws /api / location 完全相同，粘贴一遍即可）
    # }

    # 可选：80 强制跳 443（当你启用 HTTPS 后）
    # server { listen 80; server_name your.domain.com; return 301 https://$host$request_uri; }
}
