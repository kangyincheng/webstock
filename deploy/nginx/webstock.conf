# ========== webstock Nginx 主配置（客户端访问速度 + 域名 www.jeoj.com 适配版）==========
# 架构：80 端口保底；证书到位后由部署脚本写入 conf.d/webstock-https.conf 启用 443
# 避免经验 331399 提到的「硬编码 SSL 证书路径导致 nginx -t 必崩」问题。

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset utf-8;

    # --- 性能基础 ---
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    aio            threads;

    # 日志最小化（写入磁盘影响 QPS）
    access_log /var/log/nginx/access.log combined buffer=32k;
    error_log  /var/log/nginx/error.log warn;

    # 超时（长连接）
    keepalive_timeout       65s;
    keepalive_requests      1000;
    reset_timedout_connection on;
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;

    # 客户端请求大小限制
    client_max_body_size 8m;
    client_body_buffer_size 128k;

    # --- 压缩（gzip+brotli）---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/manifest+json
        font/woff font/woff2 image/svg+xml;

    # brotli（官方 nginx:alpine 镜像不含 ngx_brotli 模块，用 gzip 即可；如自建含 brotli 模块的镜像可取消注释）
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types
    #     text/plain text/css text/xml text/javascript
    #     application/json application/javascript application/xml
    #     font/woff font/woff2 image/svg+xml;

    # --- 静态文件缓存 ---
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ================= 通用 server 段宏（静态/WS/API/SPA fallback）=================
    # 实际启用 HTTPS 时，conf.d/webstock-https.conf 会 include 同名片段。这里不做 map 复用，避免变量膨胀。

    # --- 上游 FastAPI 连接池（keepalive 64 条）---
    upstream webstock_api {
        # baremetal 场景会被部署脚本 sed 替换为 127.0.0.1:8000；Docker 场景保持 webstock:8000
        server webstock:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ACME challenge 根（certbot / acme.sh webroot 模式共用）
    # 80 端口永远放行 /.well-known/acme-challenge/，这样即使 80 跳 443 也能签发新证书
    map $request_uri $is_acme {
        ~^/\.well-known/acme-challenge/  1;
        default                          0;
    }

    # 443 是否启用：由部署脚本 cert 到位后 touch /etc/nginx/enable-https.flag
    # （nginx 不支持运行期 if 打开 server，所以我们用 conf.d include + 脚本启停；这里 map 仅用于日志标记）

    include /etc/nginx/conf.d/*.conf;

    # ================== HTTP 80 ==================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name www.jeoj.com jeoj.com 8.130.158.196 _;

        # ACME challenge 永远不跳（webroot 模式）
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme-challenge;
            default_type text/plain;
            try_files $uri =404;
            access_log off;
        }

        # --- 有 443：其它请求全部 301 跳 https://www.jeoj.com（带路径保留）---
        # 检测方法：/etc/nginx/conf.d/webstock-https.conf 是否存在（脚本会写入 & 删除）
        # 注意：conf.d/*.conf 已经 include 过了，如果它存在就是已经启用 HTTPS
        # 这里用 return 301 放到最后，这样先匹配到的 ACME 不走跳转。

        root /usr/share/nginx/html;
        index index.html;

        # ---------- 静态资源：强缓存 + 内容哈希 Vite 文件名 ----------
        # /assets/* Vite build 出来都是 hash 命名，永远 1 年
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            access_log off;
            try_files $uri =404;
        }

        # favicon / robots / manifest
        location ~ ^/(favicon\.ico|robots\.txt|manifest\.webmanifest)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        # ---------- WebSocket（训练进度推送） ----------
        location /ws/ {
            proxy_pass http://webstock_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade        $http_upgrade;
            proxy_set_header Connection     "upgrade";
            proxy_set_header Host           $host;
            proxy_set_header X-Real-IP      $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # ---------- API ----------
        location /api/ {
            proxy_pass http://webstock_api;
            proxy_http_version 1.1;
            proxy_set_header Connection       "";
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_send_timeout     600s;     # 训练接口长
            proxy_read_timeout     600s;
            gzip on;
        }

        # ---------- SPA fallback：除 /api /ws /assets 外交给 index.html ----------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
