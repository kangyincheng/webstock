# ====== www.jeoj.com 高性能配置 ======
# 基于 webstock.conf 针对特定域名优化

map $http_x_forwarded_proto $is_https {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream webstock_backend {
    server webstock:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 静态资源缓存映射
map $request_uri $cache_control {
    ~^/assets/                    "public, max-age=31536000, immutable";
    ~^/fonts/                     "public, max-age=31536000, immutable";
    ~^/images/                    "public, max-age=31536000, immutable";
    ~^/(favicon\.ico|robots\.txt) "public, max-age=604800";
    default                       "public, max-age=300";
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.jeoj.com jeoj.com;

    # Let's Encrypt ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    # HTTP to HTTPS 重定向
    location / {
        return 301 https://www.jeoj.com$request_uri;
    }
}

# HTTPS 主服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jeoj.com jeoj.com;

    # SSL 证书配置（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/www.jeoj.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jeoj.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/www.jeoj.com/chain.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源根目录
    root /usr/share/nginx/html;
    index index.html;

    # --- 静态资源优化 ---
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    location /fonts/ {
        alias /usr/share/nginx/html/fonts/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- WebSocket 长连接 ---
    location /ws/ {
        proxy_pass http://webstock_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $is_https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- API 优化 ---
    location /api/ {
        proxy_pass http://webstock_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $is_https;

        # API 超时配置
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 启用 API 压缩
        gzip on;
        gzip_comp_level 6;
        gzip_types application/json application/xml text/plain;

        # API 缓存控制
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- SPA Fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}