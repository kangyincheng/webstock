# ====== www.jeoj.com 快速配置（HTTP版本，无需证书）=====

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    charset utf-8;

    # 基础性能优化
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    aio            threads;

    # 日志优化
    access_log /var/log/nginx/access.log buffer=16k flush=30s;
    error_log  /var/log/nginx/error.log warn;

    # 连接优化
    keepalive_timeout       65s;
    keepalive_requests      1000;
    reset_timedout_connection on;
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;

    # 压缩优化
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss application/manifest+json
        font/woff font/woff2 image/svg+xml;

    # 静态文件缓存
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # FastAPI 上游
    upstream webstock_api {
        server webstock:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # ACME Challenge 预留
    map $request_uri $is_acme {
        ~^/\.well-known/acme-challenge/  1;
        default                          0;
    }

    # HTTP 主服务器（无证书要求）
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name www.jeoj.com jeoj.com _;

        # ACME Challenge（用于后续HTTPS证书申请）
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme-challenge;
            default_type text/plain;
            try_files $uri =404;
            access_log off;
        }

        root /usr/share/nginx/html;
        index index.html;

        # 静态资源优化
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "DENY";
            add_header Referrer-Policy "strict-origin-when-cross-origin";
            access_log off;
            try_files $uri =404;
        }

        # favicon 和 robots
        location ~ ^/(favicon\.ico|robots\.txt|manifest\.webmanifest)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        # WebSocket（长连接）
        location /ws/ {
            proxy_pass http://webstock_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade        $http_upgrade;
            proxy_set_header Connection     "upgrade";
            proxy_set_header Host           $host;
            proxy_set_header X-Real-IP      $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering off;
            proxy_cache off;
        }

        # API 接口
        location /api/ {
            proxy_pass http://webstock_api;
            proxy_http_version 1.1;
            proxy_set_header Connection       "";
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout  10s;
            proxy_send_timeout     600s;
            proxy_read_timeout     600s;
            gzip on;
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "DENY";
            add_header Referrer-Policy "strict-origin-when-cross-origin";
        }

        # SPA Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}